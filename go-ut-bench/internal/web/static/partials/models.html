      <!-- MODELS -->
      <div x-show="page === 'models'" class="max-w-none animate-fadeUp">
        <div class="model-hero mb-4">
          <div class="model-hero-main">
            <div class="model-hero-stat"><strong x-text="models.length"></strong><span>模型总数</span></div>
            <div class="model-hero-stat"><strong x-text="models.filter(m => m.enabled).length"></strong><span>已启用</span></div>
            <div class="model-hero-stat"><strong x-text="models.filter(m => m.api_key_set || m.api_key).length"></strong><span>API Key 已配置</span></div>
            <div class="model-hero-stat"><strong x-text="Object.keys(modelTestResults || {}).length"></strong><span>已测试连接</span></div>
          </div>
          <div class="flex flex-wrap gap-2 justify-end">
            <button @click="goto('agents')" class="btn-ghost text-[12px]">Agent 接入中心</button>
          </div>
        </div>

        <div class="flex items-center gap-3 mb-4">
          <div class="text-[12px]" style="color:var(--fg-muted)">
            共 <span x-text="models.length" class="font-medium" style="color:var(--fg)"></span> 个模型
            <span x-show="modelsLoading" class="ml-2">· 加载中...</span>
          </div>
          <button @click="testAllModels()" :disabled="modelTestingAll || models.length === 0" class="btn-warm text-[12px] ml-auto">
            <span x-text="modelTestingAll ? '测试中...' : '一键测试连接'"></span>
          </button>
          <button @click="loadModels()" class="btn-ghost text-[12px]">刷新</button>
          <button @click="openAddModel()" class="btn-primary text-[12px]">+ 添加模型</button>
        </div>

        <div class="form-section p-0 overflow-x-auto">
          <div x-show="models.length === 0 && !modelsLoading" class="px-5 py-12 text-center text-[13px]" style="color:var(--fg-muted)">
            暂无模型。<button @click="openAddModel()" style="color:var(--accent)" class="hover:underline ml-1">添加模型</button>
          </div>
          <table x-show="models.length > 0" class="data-table model-table">
            <thead>
              <tr>
                <th>启用</th>
                <th>名称</th>
                <th>提供商</th>
                <th>模型 ID</th>
                <th>API 端点</th>
                <th>API Key</th>
                <th>连接</th>
                <th class="text-right">操作</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="m in models" :key="m.name">
                <tr>
                  <td>
                    <button @click="toggleModelEnabled(m)" class="relative inline-flex h-5 w-9 items-center rounded-full transition"
                            :style="m.enabled ? 'background:var(--accent)' : 'background:var(--border)'">
                      <span class="inline-block h-3.5 w-3.5 transform rounded-full bg-white transition"
                            :style="m.enabled ? 'transform:translateX(18px)' : 'transform:translateX(3px)'"></span>
                    </button>
                  </td>
                  <td class="font-medium text-[13px]"><span class="mono-clip" :title="m.name" x-text="m.name"></span></td>
                  <td class="text-[12px]" style="color:var(--fg-muted)" x-text="m.provider"></td>
                  <td class="font-mono text-[12px]"><span class="mono-clip" :title="m.model_id" x-text="m.model_id"></span></td>
                  <td class="font-mono text-[11px]" style="color:var(--fg-muted)">
                    <span class="mono-clip" :title="m.api_endpoint" x-text="m.api_endpoint"></span>
                    <template x-if="m.anthropic_endpoint">
                      <div class="mt-0.5 text-[10px]" style="color:var(--accent)">
                        <span class="mono-clip" :title="'Anthropic: ' + m.anthropic_endpoint" x-text="'Anthropic: ' + m.anthropic_endpoint"></span>
                      </div>
                    </template>
                  </td>
                  <td class="text-[12px]">
                    <div class="key-cell">
                      <span class="font-mono text-[11px] mono-clip" style="color:var(--fg-muted)" :title="m.api_key_env" x-text="m.api_key_env"></span>
                      <span class="tag-pill text-[10px]"
                            :style="m.api_key_set ? 'background:var(--success-bg);color:var(--green)' : 'background:var(--error-bg);color:var(--red)'">
                        <span x-text="m.api_key_set ? '已设置' : '未设置'"></span>
                      </span>
                    </div>
                  </td>
                  <td>
                    <div class="conn-cell">
                      <button @click="testModel(m.name)" :disabled="isModelTesting(m.name)" class="btn-ghost text-[11px] py-1 px-2.5">
                        <span x-text="isModelTesting(m.name) ? '测试中...' : '测试'"></span>
                      </button>
                      <template x-if="modelTestResult(m.name)">
                        <span class="tag-pill text-[10px]"
                              :title="modelTestResult(m.name).message"
                              :style="modelTestResult(m.name).ok ? 'background:var(--success-bg);color:var(--green)' : 'background:var(--error-bg);color:var(--red)'">
                          <span x-text="modelTestResult(m.name).ok ? '正常' : '失败'"></span>
                          <span x-show="modelTestResult(m.name).latency_ms" class="opacity-70" x-text="modelTestResult(m.name).latency_ms + 'ms'"></span>
                        </span>
                      </template>
                    </div>
                  </td>
                  <td class="text-right action-cell">
                    <button @click="openEditModel(m)" class="text-[12px] mr-2" style="color:var(--accent)">编辑</button>
                    <button @click="deleteModel(m.name)" class="text-[12px]" style="color:var(--red)">删除</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <div class="mt-4 text-[11px]" style="color:var(--fg-subtle)">
          提示：API Key 会写入当前进程环境变量，并同步到 <span class="font-mono">.env</span>；YAML 只保存环境变量名。
        </div>
      </div>
