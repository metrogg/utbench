      <!-- AGENT RUNTIME INSTALL MODAL -->
      <div x-show="agentWizardOpen" class="agent-modal-backdrop" x-cloak @keydown.escape.window="closeAgentWizard()">
        <div class="agent-modal" @click.stop>
          <div class="agent-modal-head">
            <div class="min-w-0">
              <div class="db-eyebrow">Agent Runtime</div>
              <div class="db-title">安装 Agent</div>
              <div class="agent-muted mt-2">先选择要接入的 Agent 产品，再确认沙箱镜像、密钥和评测适配。</div>
            </div>
            <button class="btn-ghost text-[12px]" @click="closeAgentWizard()">关闭</button>
          </div>

          <div class="agent-modal-body">
            <section class="agent-modal-side">
              <div class="section-title m-0">可安装运行时</div>
              <div class="agent-muted mt-2">Codex、Kilo、Claude Code 这类产品先作为 Runtime 管理，CLI 命令只放在高级适配里。</div>
              <div class="agent-runtime-list mt-4">
                <button class="agent-runtime-card" :class="agentPreset === 'codex' ? 'active' : ''" @click="selectAgentRuntime('codex')">
                  <span><strong>Codex CLI</strong><em>OpenAI</em></span>
                  <i :style="agentRuntimeStatusStyle('codex')" x-text="agentRuntimeStatusText('codex')"></i>
                </button>
                <button class="agent-runtime-card" :class="agentPreset === 'kilo' ? 'active' : ''" @click="selectAgentRuntime('kilo')">
                  <span><strong>Kilo Code</strong><em>Kilo</em></span>
                  <i :style="agentRuntimeStatusStyle('kilo')" x-text="agentRuntimeStatusText('kilo')"></i>
                </button>
                <button class="agent-runtime-card" :class="agentPreset === 'claudecode' ? 'active' : ''" @click="selectAgentRuntime('claudecode')">
                  <span><strong>Claude Code</strong><em>Anthropic</em></span>
                  <i :style="agentRuntimeStatusStyle('claudecode')" x-text="agentRuntimeStatusText('claudecode')"></i>
                </button>
                <button class="agent-runtime-card" :class="agentPreset === 'opencode' ? 'active' : ''" @click="selectAgentRuntime('opencode')">
                  <span><strong>OpenCode</strong><em>SST</em></span>
                  <i :style="agentRuntimeStatusStyle('opencode')" x-text="agentRuntimeStatusText('opencode')"></i>
                </button>
                <button class="agent-runtime-card" :class="agentPreset === 'codebuddy' ? 'active' : ''" @click="selectAgentRuntime('codebuddy')">
                  <span><strong>CodeBuddy</strong><em>Tencent</em></span>
                  <i :style="agentRuntimeStatusStyle('codebuddy')" x-text="agentRuntimeStatusText('codebuddy')"></i>
                </button>
                <button class="agent-runtime-card" :class="agentPreset === 'custom' ? 'active' : ''" @click="selectAgentRuntime('custom')">
                  <span><strong>自定义 Agent Runtime</strong><em>Custom</em></span>
                  <i :style="agentRuntimeStatusStyle('custom')" x-text="agentRuntimeStatusText('custom')"></i>
                </button>
              </div>
            </section>

            <section class="agent-modal-form">
              <div class="agent-runtime-head">
                <div class="min-w-0">
                  <div class="agent-runtime-kicker" x-text="agentRuntimeSpec().vendor"></div>
                  <div class="agent-runtime-title" x-text="agentRuntimeSpec().title"></div>
                  <p x-text="agentRuntimeSpec().summary"></p>
                </div>
                <span class="tag-pill" :style="agentRuntimeStatusStyle(agentPreset)" x-text="agentRuntimeStatusText(agentPreset)"></span>
              </div>

              <div class="agent-install-grid mt-4">
                <div class="agent-install-panel">
                  <div>
                    <span>沙箱镜像</span>
                    <code x-text="agentForm.image"></code>
                  </div>
                  <div>
                    <span>镜像状态</span>
                    <strong :style="agentRuntimeImageStyle()" x-text="agentRuntimeImageText()"></strong>
                  </div>
                  <button class="btn-ghost text-[12px]" @click="openBuildImage('agent')">安装/重建 Agent 镜像</button>
                </div>
                <div class="agent-install-panel">
                  <div>
                    <span>CLI</span>
                    <code x-text="agentRuntimeSpec().commandName"></code>
                  </div>
                  <div>
                    <span>安装方式</span>
                    <code x-text="agentRuntimeSpec().installCommand"></code>
                  </div>
                </div>
              </div>

              <label x-show="agentRuntimeSpec().needsInstall || agentRuntimeSpec().needsAdapter" class="agent-confirm-line mt-4">
                <input type="checkbox" x-model="agentRuntimeInstallConfirmed" style="accent-color:var(--accent)">
                <span>我已确认该 Agent CLI 已安装到 Agent 沙箱镜像，并且高级适配命令可非交互执行。</span>
              </label>

              <div class="grid grid-cols-2 gap-3 mt-4">
                <label><span class="label-text">Framework 名称</span><input x-model="agentForm.name" class="input-base font-mono" placeholder="codex"></label>
                <label><span class="label-text">超时秒数</span><input x-model.number="agentForm.timeout_seconds" type="number" min="60" class="input-base"></label>
              </div>

              <div class="mt-3">
                <span class="label-text">兼容语言</span>
                <div class="flex flex-wrap gap-2">
                  <button class="chip" :class="agentForm.compatible_languages.includes('python') ? 'active' : ''" @click="toggleAgentLanguage('python')">python</button>
                  <button class="chip" :class="agentForm.compatible_languages.includes('go') ? 'active' : ''" @click="toggleAgentLanguage('go')">go</button>
                  <button class="chip" :class="agentForm.compatible_languages.includes('java') ? 'active' : ''" @click="toggleAgentLanguage('java')">java</button>
                  <button class="chip" :class="agentForm.compatible_languages.includes('cpp') ? 'active' : ''" @click="toggleAgentLanguage('cpp')">cpp</button>
                </div>
              </div>

              <div class="mt-3">
                <span class="label-text">兼容模型，留空表示全部启用模型</span>
                <div class="agent-model-picks">
                  <template x-for="m in models" :key="m.name">
                    <button class="chip" :class="agentForm.compatible_models.includes(m.name) ? 'active' : ''" @click="toggleAgentModel(m.name)" x-text="m.name"></button>
                  </template>
                  <span x-show="!models.length" class="agent-muted">暂无模型配置。</span>
                </div>
              </div>

              <label class="block mt-3">
                <span class="label-text">需要从宿主机透传的密钥/环境变量</span>
                <textarea x-model="agentForm.env_from_host" class="input-base terminal" rows="3" placeholder="OPENAI_API_KEY"></textarea>
              </label>

              <button class="agent-advanced-toggle mt-4" @click="agentAdvancedOpen = !agentAdvancedOpen">
                <span>高级适配</span>
                <em x-text="agentAdvancedOpen ? '收起' : '展开'"></em>
              </button>

              <div x-show="agentAdvancedOpen" class="agent-advanced-panel mt-3">
                <label class="block">
                  <span class="label-text">输出文件匹配，一行一个</span>
                  <textarea x-model="agentForm.output_globs" class="input-base terminal" rows="3"></textarea>
                </label>
                <label class="block mt-3">
                  <span class="label-text">非交互启动命令模板</span>
                  <textarea x-model="agentForm.command" class="input-base terminal agent-command-input" rows="7"></textarea>
                </label>
                <label class="flex items-center gap-2 mt-3 text-[12px]">
                  <input type="checkbox" x-model="agentForm.network_disabled" style="accent-color:var(--accent)">禁用网络
                </label>
              </div>

              <div x-show="agentRuntimeInstalled(agentPreset)" class="agent-runtime-note mt-4">
                该 Runtime 已经在 agents.yaml 中注册。需要调整命令或密钥时，请编辑配置文件或新增一个自定义 Runtime。
              </div>
              <div x-show="agentFormError" class="mt-3 text-[12px]" style="color:var(--red)" x-text="agentFormError"></div>
              <div class="mt-4 flex justify-end gap-2">
                <button class="btn-ghost" @click="closeAgentWizard()">取消</button>
                <button class="btn-primary" :disabled="!agentCanInstallSelected()" @click="saveAgentFramework()" x-text="agentSaving ? '接入中...' : (agentRuntimeInstalled(agentPreset) ? '已接入' : '接入评测')"></button>
              </div>
            </section>
          </div>
        </div>
      </div>
