      <!-- MODEL FORM MODAL -->
      <div x-show="modelFormOpen" x-transition.opacity class="fixed inset-0 z-50 flex items-center justify-center" style="background:var(--overlay-bg)">
        <div @click.outside="closeModelForm()" class="form-section w-[min(920px,calc(100vw-32px))] m-4" style="max-height:90vh;overflow-y:auto">
          <div class="flex items-center justify-between mb-4">
            <div class="text-[14px] font-medium" x-text="modelFormMode === 'create' ? '添加模型' : '编辑模型：' + modelForm.name"></div>
            <button @click="closeModelForm()" class="btn-ghost text-[12px]">关闭</button>
          </div>

          <div class="space-y-3">
            <div>
              <label class="text-[11px] font-medium" style="color:var(--fg-muted)">名称（唯一标识）<span style="color:var(--red)">*</span></label>
              <input x-model="modelForm.name" :disabled="modelFormMode === 'edit'" type="text" class="input-base w-full" placeholder="例如：qwen-max">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div>
                <label class="text-[11px] font-medium" style="color:var(--fg-muted)">提供商 <span style="color:var(--red)">*</span></label>
                <input x-model="modelForm.provider" type="text" class="input-base w-full" placeholder="例如：dashscope / openai / deepseek">
              </div>
              <div>
                <label class="text-[11px] font-medium" style="color:var(--fg-muted)">模型 ID <span style="color:var(--red)">*</span></label>
                <input x-model="modelForm.model_id" type="text" class="input-base w-full" placeholder="例如：qwen-max-2026-04-01">
              </div>
            </div>
            <div>
              <label class="text-[11px] font-medium" style="color:var(--fg-muted)">API 端点（OpenAI 兼容）<span style="color:var(--red)">*</span></label>
              <input x-model="modelForm.api_endpoint" type="text" class="input-base w-full font-mono text-[12px]" placeholder="https://api.example.com/v1">
            </div>
            <div>
              <label class="text-[11px] font-medium" style="color:var(--fg-muted)">Anthropic 端点
                <span style="color:var(--fg-subtle)" class="font-normal">（Claude Code 使用，可选）</span>
              </label>
              <input x-model="modelForm.anthropic_endpoint" type="text" class="input-base w-full font-mono text-[12px]" placeholder="例如：https://api.deepseek.com/anthropic">
              <div class="mt-1 text-[11px]" style="color:var(--fg-subtle)">Claude Code 需要 Anthropic 兼容端点。留空则 Claude Code 使用上方的 OpenAI 端点。</div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div>
                <label class="text-[11px] font-medium" style="color:var(--fg-muted)">API Key 环境变量名</label>
                <input x-model="modelForm.api_key_env" type="text" class="input-base w-full font-mono text-[12px]" placeholder="留空自动生成">
              </div>
              <div>
                <label class="text-[11px] font-medium" style="color:var(--fg-muted)">API Key
                  <span style="color:var(--fg-subtle)" class="font-normal">(同步到 .env)</span>
                </label>
                <input x-model="modelForm.api_key" type="password" class="input-base w-full font-mono text-[12px]"
                       :placeholder="modelForm.api_key_set ? '已设置，留空不修改' : '输入 API Key'">
                <div class="mt-1 text-[11px]" :style="modelForm.api_key_set ? 'color:var(--green)' : 'color:var(--fg-subtle)'"
                     x-text="modelForm.api_key_set ? '当前进程/.env 已保存该变量。重新输入可覆盖。' : '保存后会写入当前进程并同步到 .env。'"></div>
              </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
              <div>
                <label class="text-[11px] font-medium" style="color:var(--fg-muted)">temperature</label>
                <input x-model.number="modelForm.parameters.temperature" type="number" step="0.1" min="0" max="2" class="input-base w-full">
              </div>
              <div>
                <label class="text-[11px] font-medium" style="color:var(--fg-muted)">top_p</label>
                <input x-model.number="modelForm.parameters.top_p" type="number" step="0.05" min="0" max="1" class="input-base w-full">
              </div>
              <div>
                <label class="text-[11px] font-medium" style="color:var(--fg-muted)">max_tokens</label>
                <input x-model.number="modelForm.parameters.max_tokens" type="number" step="256" min="128" class="input-base w-full">
              </div>
            </div>
            <div class="flex items-center gap-2 pt-1">
              <input x-model="modelForm.enabled" type="checkbox" id="mf_enabled">
              <label for="mf_enabled" class="text-[12px]">启用此模型</label>
            </div>

            <div x-show="modelFormError" class="text-[12px] px-3 py-2 rounded" style="background:rgba(239,68,68,.08);color:var(--red)" x-text="modelFormError"></div>

            <div class="flex items-center justify-end gap-2 pt-2">
              <button @click="closeModelForm()" class="btn-ghost">取消</button>
              <button @click="saveModel()" class="btn-primary" x-text="modelFormMode === 'create' ? '添加' : '保存'"></button>
            </div>
          </div>
        </div>
      </div>
