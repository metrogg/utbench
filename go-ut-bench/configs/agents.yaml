# Agent/Skill subject configuration for UT-Bench.

# Subject = framework + model + optional skill.

#

# UT-Bench will still add model_api__<model>__no_skill automatically

# as the pure-model baseline.

frameworks:
    opencode:
        enabled: true
        kind: cli_agent
        sandbox:
            provider: docker
            mode: docker
            image: utbench-agent-base:latest
            timeout_seconds: 600
            network_disabled: false
            memory: 2g
            cpu: "2"
        preflight:
            python:
                - command -v opencode
            go:
                - command -v opencode
            java:
                - command -v opencode
            cpp:
                - command -v opencode
        forbidden_command_patterns:
            - apt-get update
            - apt-get install
            - apt install
            - apk add
            - yum install
            - dnf install
            - pip install
            - pip3 install
            - python -m pip install
            - python3 -m pip install
            - npm install
            - yarn add
            - pnpm add
        env:
            PATH: "/go/bin:/usr/local/go/bin:/opt/java/openjdk/bin:/usr/share/maven/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            XDG_CONFIG_HOME: "{{.ContainerWorkdir}}/.utbench/xdg-config"
            XDG_DATA_HOME: "{{.ContainerWorkdir}}/.utbench/xdg-data"
            OPENCODE_DISABLE_CLAUDE_CODE: "true"
            OPENCODE_DISABLE_DEFAULT_PLUGINS: "true"
            OPENCODE_CONFIG_CONTENT: |
                {
                  "$schema": "https://opencode.ai/config.json",
                  "provider": {
                    "utbench": {
                      "npm": "@ai-sdk/openai-compatible",
                      "name": "UT-Bench Provider",
                      "options": {
                        "baseURL": "{{.ModelEndpoint}}",
                        "apiKey": "{env:{{.ModelAPIKeyEnv}}}"
                      },
                      "models": {
                        "{{.ModelID}}": {
                          "name": "{{.ModelID}}"
                        }
                      }
                    }
                  }
                }
        env_from_host:
            - DEEPSEEK_API_KEY
            - DASHSCOPE_API_KEY
            - MINIMAX_API_KEY
            - MINIMAX2.5_API_KEY
            - VOLCENGINE_API_KEY
            - ARK_API_KEY
            - BIGMODEL_API_KEY
        command: >
            mkdir -p "$XDG_CONFIG_HOME/opencode" "$XDG_DATA_HOME" "{{.ContainerWorkdir}}/.utbench/opencode" && printf '%s' "$OPENCODE_CONFIG_CONTENT" > "$XDG_CONFIG_HOME/opencode/config.json" && PROMPT="$(cat {{.ContainerPrompt}})" && opencode run --print-logs --dangerously-skip-permissions --model utbench/{{.ModelID}} "$PROMPT"

        compatible_languages:
            - python
            - go
            - java
            - cpp
        output_globs:
            - generated_test.py
            - "test_*.py"
            - "*_test.go"
            - "*Test.java"
            - "*test*.cpp"
    codebuddy:
        enabled: true
        kind: cli_agent
        sandbox:
            provider: docker
            mode: docker
            image: utbench-agent-base:latest
            timeout_seconds: 600
            network_disabled: false
            memory: 2g
            cpu: "2"
        preflight:
            python:
                - command -v codebuddy
            go:
                - command -v codebuddy
            java:
                - command -v codebuddy
            cpp:
                - command -v codebuddy
        forbidden_command_patterns:
            - apt-get update
            - apt-get install
            - apt install
            - apk add
            - yum install
            - dnf install
            - pip install
            - pip3 install
            - python -m pip install
            - python3 -m pip install
            - npm install
            - yarn add
            - pnpm add
        env:
            PATH: "/go/bin:/usr/local/go/bin:/opt/java/openjdk/bin:/usr/share/maven/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            CODEBUDDY_CONFIG_DIR: "{{.ContainerWorkdir}}/.codebuddy"
            CODEBUDDY_CODE_MAX_TURNS: "50"
            CODEBUDDY_DISABLE_AUTOUPDATER: "1"
            CODEBUDDY_DISABLE_AUTO_MEMORY: "1"
            CODEBUDDY_DISABLE_HOT_RELOAD: "1"
            DISABLE_AUTOUPDATER: "1"
            UTBENCH_MODEL_ID: "{{.ModelID}}"
            UTBENCH_MODEL_ENDPOINT: "{{.ModelEndpoint}}"
            UTBENCH_MODEL_API_KEY_ENV: "{{.ModelAPIKeyEnv}}"
        env_from_host:
            - CODEBUDDY_API_KEY
            - CODEBUDDY_INTERNET_ENVIRONMENT
            - DEEPSEEK_API_KEY
            - DASHSCOPE_API_KEY
            - MINIMAX_API_KEY
            - MINIMAX2.5_API_KEY
            - VOLCENGINE_API_KEY
            - ARK_API_KEY
            - BIGMODEL_API_KEY
        # CodeBuddy models.json 配置自定义模型端点。

        # url 必须以 /chat/completions 结尾；apiKey 使用 ${ENV_VAR} 语法由 CodeBuddy 解析。

        # --model 和 --max-turns 是官方支持的 CLI 参数。

        # -y (--dangerously-skip-permissions) 是非交互模式执行文件操作的必需参数。

        # 自定义模型需要 custom-local: 前缀，CodeBuddy 后端以此识别自定义端点。
        command: >
            mkdir -p "{{.ContainerWorkdir}}/.codebuddy" && printf '{"models":[{"id":"custom-local:%s","name":"%s (UT-Bench)","url":"%s/chat/completions","apiKey":"${%s}","maxInputTokens":128000,"maxOutputTokens":8192,"supportsToolCall":true}],"availableModels":["custom-local:%s"]}' "$UTBENCH_MODEL_ID" "$UTBENCH_MODEL_ID" "$UTBENCH_MODEL_ENDPOINT" "$UTBENCH_MODEL_API_KEY_ENV" "$UTBENCH_MODEL_ID" > "{{.ContainerWorkdir}}/.codebuddy/models.json" && PROMPT="$(cat {{.ContainerPrompt}})" && codebuddy -p -y --output-format stream-json --model "custom-local:$UTBENCH_MODEL_ID" --max-turns 50 "$PROMPT"

        compatible_languages:
            - python
            - go
            - java
            - cpp
        output_globs:
            - generated_test.py
            - "test_*.py"
            - "*_test.go"
            - "*Test.java"
            - "*test*.cpp"
    claudecode:
        enabled: true
        kind: cli_agent
        sandbox:
            provider: docker
            mode: docker
            image: utbench-agent-base:latest
            timeout_seconds: 600
            network_disabled: false
            memory: 2g
            cpu: "2"
        preflight:
            python:
                - command -v claude
            go:
                - command -v claude
            java:
                - command -v claude
            cpp:
                - command -v claude
        forbidden_command_patterns:
            - apt-get update
            - apt-get install
            - apt install
            - apk add
            - yum install
            - dnf install
            - pip install
            - pip3 install
            - python -m pip install
            - python3 -m pip install
            - npm install
            - yarn add
            - pnpm add
        env:
            PATH: "/go/bin:/usr/local/go/bin:/opt/java/openjdk/bin:/usr/share/maven/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            CLAUDE_CONFIG_DIR: "{{.ContainerWorkdir}}/.claude"
            CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
            DISABLE_AUTOUPDATER: "1"
            # 通过模板变量将 models.yaml 中的模型端点注入 Claude Code

            # 优先使用 anthropic_endpoint（Anthropic 兼容），回退到 api_endpoint
            ANTHROPIC_BASE_URL: "{{if .AnthropicEndpoint}}{{.AnthropicEndpoint}}{{else}}{{.ModelEndpoint}}{{end}}"
            ANTHROPIC_MODEL: "{{.ModelID}}"
            ANTHROPIC_DEFAULT_OPUS_MODEL: "{{.ModelID}}"
            ANTHROPIC_DEFAULT_SONNET_MODEL: "{{.ModelID}}"
            ANTHROPIC_DEFAULT_HAIKU_MODEL: "{{.ModelID}}"
        env_from_host:
            # 认证密钥从宿主机环境变量透传

            # 用户应将 ANTHROPIC_AUTH_TOKEN 设置为对应 provider 的 API key

            # 例如使用 DeepSeek 时: export ANTHROPIC_AUTH_TOKEN=$DEEPSEEK_API_KEY
            - ANTHROPIC_API_KEY
            - ANTHROPIC_AUTH_TOKEN
            - ANTHROPIC_CUSTOM_HEADERS
            # 原生 Claude 模型支持（Bedrock/Vertex/Foundry）

            - CLAUDE_CODE_USE_BEDROCK
            - CLAUDE_CODE_USE_VERTEX
            - CLAUDE_CODE_USE_FOUNDRY
            - AWS_REGION
            - AWS_ACCESS_KEY_ID
            - AWS_SECRET_ACCESS_KEY
            - AWS_SESSION_TOKEN
            - GOOGLE_APPLICATION_CREDENTIALS
            - CLOUD_ML_REGION
            - ANTHROPIC_VERTEX_PROJECT_ID
            - ANTHROPIC_FOUNDRY_API_KEY
            - ANTHROPIC_FOUNDRY_RESOURCE
        command: >
            mkdir -p "{{.ContainerWorkdir}}/.claude" && PROMPT="$(cat {{.ContainerPrompt}})" && claude -p {{if eq .Skill ""}}--bare{{end}} --output-format stream-json --verbose --permission-mode bypassPermissions --max-turns 50 --model "{{.ModelID}}" "$PROMPT"

        compatible_languages:
            - python
            - go
            - java
            - cpp
        output_globs:
            - generated_test.py
            - "test_*.py"
            - "*_test.go"
            - "*Test.java"
            - "*test*.cpp"
    codex:
        enabled: true
        kind: cli_agent
        sandbox:
            provider: docker
            mode: docker
            image: utbench-agent-base:latest
            timeout_seconds: 600
            network_disabled: false
            memory: 2g
            cpu: "2"
        preflight:
            python:
                - command -v codex
            go:
                - command -v codex
            java:
                - command -v codex
            cpp:
                - command -v codex
        forbidden_command_patterns:
            - apt-get update
            - apt-get install
            - apt install
            - apk add
            - yum install
            - dnf install
            - pip install
            - pip3 install
            - python -m pip install
            - python3 -m pip install
            - npm install
            - yarn add
            - pnpm add
        env_from_host:
            - OPENAI_API_KEY
        command: |-
            PROMPT="$(cat {{.ContainerPrompt}})" &&
            codex exec --skip-git-repo-check --sandbox workspace-write \
              -c 'model_provider="utbench"' \
              -c 'model_providers.utbench.name="{{.ModelProvider}} via UT-Bench"' \
              -c 'model_providers.utbench.base_url="{{.ModelEndpoint}}"' \
              -c 'model_providers.utbench.env_key="{{.ModelAPIKeyEnv}}"' \
              -c 'model_providers.utbench.wire_api="chat"' \
              --model "{{.ModelID}}" "$PROMPT"
        compatible_languages:
            - python
            - go
            - java
            - cpp
        output_globs:
            - generated_test.py
            - test_*.py
            - '*_test.go'
            - '*Test.java'
            - '*test*.cpp'
    kilo:
        enabled: true
        kind: cli_agent
        sandbox:
            provider: docker
            mode: docker
            image: utbench-agent-base:latest
            timeout_seconds: 600
            network_disabled: false
            memory: 2g
            cpu: "2"
        preflight:
            python:
                - command -v kilo
            go:
                - command -v kilo
            java:
                - command -v kilo
            cpp:
                - command -v kilo
        forbidden_command_patterns:
            - apt-get update
            - apt-get install
            - apt install
            - apk add
            - yum install
            - dnf install
            - pip install
            - pip3 install
            - python -m pip install
            - python3 -m pip install
            - npm install
            - yarn add
            - pnpm add
        env_from_host:
            - KILO_API_KEY
            - KILO_PROVIDER
            - KILOCODE_MODEL
            - KILO_ORG_ID
        command: |-
            mkdir -p "$XDG_CONFIG_HOME/kilo" &&
            printf '{"permission":"allow"}' > "$XDG_CONFIG_HOME/kilo/opencode.json" &&
            PROMPT="$(cat {{.ContainerPrompt}})" &&
            kilo run --auto --timeout 600 "$PROMPT"
        compatible_languages:
            - python
            - go
            - java
            - cpp
        output_globs:
            - generated_test.py
            - test_*.py
            - '*_test.go'
            - '*Test.java'
            - '*test*.cpp'
skills:
    unit_test_skill:
        enabled: true
        version: "2"
        description: >
            Professional unit-test generation skill. Injects a structured methodology: analysis phase, test structure guidelines, naming conventions, assertion quality rules, mocking patterns, language-specific templates, and a pre-flight quality checklist.

        inject_mode: agent_native
        instruction_path: ./skills/unit_test_skill/instructions.md
        files:
            - ./skills/unit_test_skill/checklist.md
            - ./skills/unit_test_skill/examples/python_example.py
        compatible_frameworks:
            - opencode
            - codebuddy
            - claudecode
            - codex
        compatible_languages:
            - python
            - go
            - java
            - cpp
    qta-ut:
        enabled: true
        version: "1"
        description: >
            QTA 团队专业单测生成 skill。包含完整的单测编写流程：函数分解、 必要性评估、语言规范参考（Go/Python/Java/C++/JS/PHP）、 跟踪上报和结果总结。

        inject_mode: agent_native
        instruction_path: ./skills/qta-ut/SKILL.md
        files:
            - ./skills/qta-ut/references/
            - ./skills/qta-ut/scripts/
        compatible_frameworks:
            - codebuddy
            - claudecode
            - codex
        compatible_languages:
            - python
            - go
            - java
            - cpp
