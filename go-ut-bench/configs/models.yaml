        provider: minimax
    qwen:
        config:
            api_endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1
            api_key_env: DASHSCOPE_API_KEY
            model: qwen3.6-plus
            parameters:
                max_tokens: 4096
                temperature: 0.7
                top_p: 0.9
        enabled: true
        provider: dashscope
