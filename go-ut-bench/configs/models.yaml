        provider: volcengine
    kimi-k2.6:
        config:
            api_endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1
            api_key_env: KIMI_K2_6_API_KEY
            model: kimi-k2.6
            parameters:
                max_tokens: 4096
                temperature: 0.7
                top_p: 0.9
        enabled: true
        provider: moonshot
    minimax:
        config:
            api_endpoint: https://api.minimax.chat/v1
            api_key_env: MINIMAX_API_KEY
            model: MiniMax-M2.7
            parameters:
                max_tokens: 4096
                temperature: 0.7
                top_p: 0.9
