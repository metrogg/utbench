      api_endpoint: "https://ark.cn-beijing.volces.com/api/v3"
      model: "ep-20260425130248-lqxth"
      api_key_env: "ARK_API_KEY"
      parameters:
        temperature: 0.7
        top_p: 0.9
        max_tokens: 4096

benchmark:
  thresholds:
    compile_rate: 0.7
    execution_rate: 0.70
    line_coverage: 0.7
    branch_coverage: 0.6
    function_coverage: 0.8
    mutation_score: 0.70

  timeouts:
    api_call: 120000
    compilation: 60000
    test_execution: 30000
    mutation_test: 120000

  parallel:
    max_concurrent_models: 6
    max_concurrent_samples: 8

languages:
  java:
    compiler: "javac"
    test_framework: "junit"
    test_framework_version: "4.13"
    coverage_tool: "jacoco"
    mutation_tool: "pitest"
    source_dir: "src/main/java"
    test_dir: "src/test/java"

  python:
    compiler: "pylint"
    test_framework: "pytest"
    coverage_tool: "coverage"
    mutation_tool: "mutmut"
    source_dir: "src"
    test_dir: "tests"

  go:
    compiler: "go build"
    test_framework: "go test"
    coverage_tool: "go tool cover"
    mutation_tool: "go-mutesting"
    source_dir: "."
    test_dir: "."

  cpp:
    compiler: "g++"
    test_framework: "gtest"
    coverage_tool: "gcov"
    mutation_tool: "mull"
    source_dir: "src"
    test_dir: "tests"
