benchmark:
    parallel:
        max_concurrent_models: 6
        max_concurrent_samples: 8
    thresholds:
        branch_coverage: 0.6
        compile_rate: 0.7
        execution_rate: 0.7
        function_coverage: 0.8
        line_coverage: 0.7
        mutation_score: 0.7
    timeouts:
        api_call: 120000
        compilation: 60000
        mutation_test: 120000
        test_execution: 30000
languages:
    cpp:
        compiler: g++
        coverage_tool: gcov
        mutation_tool: mull
        source_dir: src
        test_dir: tests
        test_framework: gtest
    go:
        compiler: go build
        coverage_tool: go tool cover
        mutation_tool: gremlins
        source_dir: .
        test_dir: .
        test_framework: go test
    java:
        compiler: javac
        coverage_tool: jacoco
        mutation_tool: pitest
        source_dir: src/main/java
        test_dir: src/test/java
        test_framework: junit
        test_framework_version: "4.13"
    python:
        compiler: pylint
        coverage_tool: coverage
        mutation_tool: mutmut
        source_dir: src
        test_dir: tests
        test_framework: pytest
models:
    GLM-5.1:
        config:
            api_endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1
            api_key_env: GLM_5.1_API_KEY
            model: glm-5.1
            parameters:
                max_tokens: 4096
                temperature: 0.7
                top_p: 0.9
        enabled: true
        provider: dashscope
    GPT-5.4:
        config:
            api_endpoint: https://api.univibe.cc/openai/v1
            api_key_env: GPT_5.4_API_KEY
            model: gpt-5.4
            parameters:
                max_tokens: 4096
                temperature: 0.7
                top_p: 0.9
        enabled: true
        provider: openai
    deepseek:
        config:
            api_endpoint: https://api.deepseek.com/v1
            api_key_env: DEEPSEEK_API_KEY
            model: deepseek-v4-flash
            parameters:
                max_tokens: 4096
                temperature: 0.7
                top_p: 0.9
        enabled: true
        provider: deepseek
    doubao-seed:
        config:
            api_endpoint: https://ark.cn-beijing.volces.com/api/coding/v3
            api_key_env: VOLCENGINE_API_KEY
            model: doubao-seed-2.0-pro
            parameters:
                max_tokens: 4096
                temperature: 0.7
                top_p: 0.9
