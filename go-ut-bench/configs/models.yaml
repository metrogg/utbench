models:
  
  deepseek-v4-flash:
    enabled: true
    provider: deepseek
    config:
      api_endpoint: "https://api.deepseek.com"
      model: "deepseek-v4-flash"
      api_key_env: "DEEPSEEK_API_KEY"
      parameters:
        temperature: 0.7
        top_p: 0.9
        max_tokens: 4096

  minimax2.7:
    enabled: true
    provider: minimax
    config:
      api_endpoint: "https://api.minimax.chat/v1"
      model: "MiniMax-M2.7"
      api_key_env: "MINIMAX_API_KEY"
      parameters:
        temperature: 0.7
        top_p: 0.9
        max_tokens: 4096

  


  deepseek-v3.2:  # 火山方舟上的 DeepSeek
    enabled: true
    provider: volcengine
    config:
      api_endpoint: "https://ark.cn-beijing.volces.com/api/v3"
      model: "ep-20260425131055-4q4ck"  # 你的 endpoint ID
      api_key_env: "ARK_API_KEY"
      parameters:
        temperature: 0.7
        top_p: 0.9
        max_tokens: 4096  

  doubao-seed-1.6-flash:
