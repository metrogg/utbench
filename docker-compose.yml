version: '3.8'

services:
  utbench:
    build:
      context: .
      dockerfile: Dockerfile
    image: utbench:latest
    container_name: utbench-runner
    
    # Mount volumes for persistence
    volumes:
      - ./datasets:/app/datasets
      - ./artifacts:/app/artifacts
      - ./storage:/app/storage
      - ./configs:/app/configs
    
    # Pass environment variables for API keys
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - VOLCENGINE_API_KEY=${VOLCENGINE_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - BIGMODEL_API_KEY=${BIGMODEL_API_KEY:-}
      - TEST_API_KEY=${TEST_API_KEY:-}
    
    # Default command - can be overridden
    command: ["--help"]
    
    # Resource limits (optional)
    # deploy:
    #   resources:
    #     limits:
    #       memory: 4G
    #       cpus: '2'

  # Quick run examples (use: docker-compose run <service>)
  run-python:
    extends:
      service: utbench
    command: ["run", "--models", "deepseek", "--langs", "python", "--max-samples", "2", "--dry-run"]
    
  run-all:
    extends:
      service: utbench
    command: ["run", "--models", "deepseek", "--langs", "python,go,java,cpp", "--max-samples", "5"]